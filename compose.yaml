name: purchase-system

services:
  backend:
    build:
      context: ./backend
      dockerfile: Containerfile
    container_name: purchase-backend
    restart: unless-stopped
    userns_mode: keep-id
    volumes:
      # :Z を付けてSELinuxラベルを自動調整（SQLiteはディレクトリごとマウントが鉄則）
      - ./data:/app/data:Z
      - ./backup:/app/backup:Z
      - ./config.yaml:/app/config.yaml:ro,Z
    environment:
      - TZ=Asia/Tokyo
    expose:
      - "8080"

  frontend:
    build:
      context: ./frontend
      dockerfile: Containerfile
    container_name: purchase-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "8443:8443"
    depends_on:
      - backend
    volumes:
      - ./certbot/ssl/fullchain.pem:/etc/letsencrypt/live/default/fullchain.pem:ro,Z
      - ./certbot/ssl/privkey.pem:/etc/letsencrypt/live/default/privkey.pem:ro,Z
    environment:
      - TZ=Asia/Tokyo

networks:
  default:
    driver: bridge
    ipam:
      config:
        - subnet: 192.168.250.0/24
